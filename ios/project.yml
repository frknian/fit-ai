name: Hedefit
options:
  bundleIdPrefix: com.hedefit
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.2.11
    CURRENT_PROJECT_VERSION: 22
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
configs:
  Debug: debug
  Release: release
targets:
  Hedefit:
    type: application
    platform: iOS
    sources:
      - path: Hedefit
        excludes:
          - Info.plist
          - Hedefit.entitlements
          - Assets.xcassets
    info:
      path: Hedefit/Info.plist
    entitlements:
      path: Hedefit/Hedefit.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hedefit.app
        PRODUCT_NAME: Hedefit
        INFOPLIST_KEY_CFBundleDisplayName: Hedefit
        CODE_SIGN_ENTITLEMENTS: Hedefit/Hedefit.entitlements
    configFiles:
      Debug: Config.base.xcconfig
      Release: Config.base.xcconfig
    dependencies:
      - target: HedefitWidgets
        embed: true
  HedefitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HedefitWidgets
    info:
      path: HedefitWidgets/Info.plist
    entitlements:
      path: HedefitWidgets/HedefitWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hedefit.app.widgets
        PRODUCT_NAME: HedefitWidgets
        SKIP_INSTALL: YES
    configFiles:
      Debug: Config.base.xcconfig
      Release: Config.base.xcconfig
