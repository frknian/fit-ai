ext {
    // 26 (Android 8.0), 24 DEĞİL.
    //
    // capacitor-health eklentisi androidx.health.connect üzerinden minSdk 26
    // dayatıyor; 24 ile manifest birleştirme HATA veriyordu, yani Android
    // derlemesi bu eklenti eklendiğinden beri (21d22c9) hiç çalışmıyordu.
    // API 26 tabanı 2026 itibarıyla etkin cihazların neredeyse tamamını
    // kapsar; LiteRT-LM'in tabanı da 24 olduğu için cihaz üstü AI etkilenmez.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // --- Cihaz üstü AI (Phase 2) -------------------------------------------
    // Sürümler SABİT. 'latest.release' / '+' kullanılmaz: derlemenin ne zaman
    // çalıştığına göre farklı bir çalışma zamanı çekmek, cihazda ancak
    // kullanıcıda ortaya çıkan hatalar üretir.
    // kotlinVersion android/build.gradle > buildscript içinde tanımlıdır
    // (buildscript bu dosyadan önce değerlendirilir).
    // LiteRT-LM AAR bytecode'u SendChannel.close$default'i arayüz üzerinde
    // çağırıyor; bu köprü 1.11.0 öncesinde DefaultImpls içindeydi. Yayınlanan
    // POM hâlâ 1.9.0 dese de gerçek cihazda üretim tamamlanırken
    // NoSuchMethodError ile süreç çöküyor. 1.11.0 bu ABI'yi sağlar.
    kotlinCoroutinesVersion = '1.11.0'
    // com.google.ai.edge.litertlm:litertlm-android — Google Maven'den
    // doğrulanmış en güncel kararlı sürüm (2026-08-18).
    litertLmVersion = '0.16.1'
}
